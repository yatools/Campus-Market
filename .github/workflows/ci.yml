name: CI

on:
  push:
  pull_request:

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: cp .env.staging.example .env.staging
      - run: docker compose --env-file .env config --quiet
      - run: docker compose -p wutong-staging --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml config --quiet
      - run: bash -n deploy/*.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wutong_test
          POSTGRES_USER: wutong
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wutong -d wutong_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://wutong:test-password@127.0.0.1:5432/wutong_test
      TEST_DATABASE_URL: postgresql://wutong:test-password@127.0.0.1:5432/wutong_test
      SECRET_KEY: test-secret-key-that-is-long-enough-for-ci
      ALLOWED_CAMPUS_EMAIL_DOMAINS: test.edu.cn
      COOKIE_SECURE: "false"
      DOCS_ENABLED: "true"
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libvips-tools postgresql-client
      - run: test -z "$(gofmt -l cmd internal api tools.go)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/wutong
      - run: go run ./cmd/wutong migrate up
      - run: go run ./cmd/wutong migrate status
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc generate
      - run: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen --config oapi-codegen.yaml api/openapi-3.0.json
      - run: git diff --exit-code -- internal/dbgen internal/openapi
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
