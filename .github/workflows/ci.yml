name: CI

on:
  push:
  pull_request:

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: cp .env.staging.example .env.staging
      - run: docker compose --env-file .env config --quiet
      - run: docker compose -p wutong-staging --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml config --quiet
      - run: bash -n deploy/*.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wutong_test
          POSTGRES_USER: wutong
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wutong -d wutong_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://wutong:test-password@127.0.0.1:5432/wutong_test
      TEST_DATABASE_URL: postgresql+psycopg://wutong:test-password@127.0.0.1:5432/wutong_test
      SECRET_KEY: test-secret-key-that-is-long-enough-for-ci
      ALLOWED_CAMPUS_EMAIL_DOMAINS: test.edu.cn
      AUTO_CREATE_SCHEMA: "false"
      DOCS_ENABLED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pip-audit -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
