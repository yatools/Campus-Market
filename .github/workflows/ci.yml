name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 每个分支只保留最新的 PR 检查；main 发布不可中断。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: cp .env.example .env
      - run: cp .env.staging.example .env.staging
      - run: docker compose --env-file .env config --quiet
      - run: docker compose -p wutong-staging --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml config --quiet
      # 按脚本声明的 POSIX shell 检查语法。
      - run: for script in deploy/*.sh; do sh -n "$script"; done
      - name: shellcheck
        run: |
          posix=$(grep -l '^#!/usr/bin/env sh' deploy/*.sh)
          bashy=$(grep -l '^#!/usr/bin/env bash' deploy/*.sh)
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 --severity=warning -s sh $posix
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 --severity=warning $bashy
      - run: bash deploy/test-deploy.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wutong_test
          POSTGRES_USER: wutong
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wutong -d wutong_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://wutong:test-password@127.0.0.1:5432/wutong_test
      TEST_DATABASE_URL: postgresql://wutong:test-password@127.0.0.1:5432/wutong_test
      SECRET_KEY: test-secret-key-that-is-long-enough-for-ci
      ALLOWED_CAMPUS_EMAIL_DOMAINS: test.edu.cn
      COOKIE_SECURE: "false"
      DOCS_ENABLED: "true"
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libvips-tools postgresql-client
      - name: Start MinIO
        run: |
          docker run -d --name minio-ci -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/ready && exit 0; sleep 1; done
          exit 1
      - run: test -z "$(gofmt -l cmd internal api)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce backend coverage floor
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 18) { print "backend coverage " coverage "% is below 18%"; exit 1 } }'
      - name: Enforce 85% critical-package coverage
        run: |
          for package in ./internal/config ./internal/security ./internal/marketpolicy; do
            name=$(basename "$package")
            go test -coverprofile="$name.coverage.out" "$package"
            coverage=$(go tool cover -func="$name.coverage.out" | awk '/^total:/ {gsub("%","",$3); print $3}')
            awk -v package="$package" -v coverage="$coverage" 'BEGIN { if (coverage < 85) { print package " coverage " coverage "% is below 85%"; exit 1 } }'
          done
      - run: go build ./cmd/wutong
      # 查询计划采集前确保 schema 位于最新版本。
      - run: go run ./cmd/wutong migrate up
      - name: Capture query plan baselines
        run: psql "$TEST_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -f ../deploy/query-plan-baselines.sql > query-plans.json
      # 每条 EXPLAIN 输出一个顶层 JSON 文档。
      - name: Validate query plan output
        run: |
          python3 - <<'PY'
          import json
          text = open('query-plans.json').read().strip()
          decoder, index, documents = json.JSONDecoder(), 0, 0
          while index < len(text):
              _, end = decoder.raw_decode(text, index)
              documents += 1
              index = end
              while index < len(text) and text[index].isspace():
                  index += 1
          assert documents >= 1, 'no query plans captured'
          print(f'{documents} query plan documents captured')
          PY
      - run: go run ./cmd/wutong migrate status
      - run: go run ./cmd/wutong migrate down
      - run: go run ./cmd/wutong migrate up
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: query-plans-${{ github.sha }}
          path: backend/query-plans.json
          if-no-files-found: error
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - run: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.2 --config oapi-codegen.yaml api/openapi.yaml
      - run: git diff --exit-code -- internal/dbgen internal/openapi
      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/$BASE_REF:backend/api/openapi.yaml" > /tmp/openapi-base.yaml
          node ../deploy/check-openapi-breaking.mjs /tmp/openapi-base.yaml api/openapi.yaml
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run check:legacy-api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run generate:api
      - run: git diff --exit-code -- src/generated
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test

  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash deploy/test-restore.sh

  container-security:
    runs-on: ubuntu-latest
    # 只有部署、代码、恢复演练全部通过后才构建发布候选镜像。
    needs: [deployment-config, backend, frontend, restore-drill]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.65.0 fs --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 /src
      - run: docker build -t wutong-api:${{ github.sha }} backend

      - run: docker build -t wutong-worker:${{ github.sha }} backend
      - run: docker build -f frontend/Dockerfile -t wutong-web:${{ github.sha }} .
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 wutong-api:${{ github.sha }}

      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 wutong-worker:${{ github.sha }}
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 wutong-web:${{ github.sha }}
      # 发布阶段加载这些已扫描镜像，不重新构建。
      - name: Export scanned images
        run: |
          mkdir -p /tmp/images
          docker save "wutong-api:${GITHUB_SHA}" -o /tmp/images/api.tar
          docker save "wutong-worker:${GITHUB_SHA}" -o /tmp/images/worker.tar
          docker save "wutong-web:${GITHUB_SHA}" -o /tmp/images/web.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanned-images-${{ github.sha }}
          path: /tmp/images/*.tar
          retention-days: 1
          if-no-files-found: error

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [container-security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scanned-images-${{ github.sha }}
          path: /tmp/images
      - run: |
          api="ghcr.io/${GITHUB_REPOSITORY,,}/api:sha-${GITHUB_SHA}"
          worker="ghcr.io/${GITHUB_REPOSITORY,,}/worker:sha-${GITHUB_SHA}"
          web="ghcr.io/${GITHUB_REPOSITORY,,}/web:sha-${GITHUB_SHA}"
          # Load the scanned image artifacts without rebuilding.
          docker load -i /tmp/images/api.tar
          docker load -i /tmp/images/worker.tar
          docker load -i /tmp/images/web.tar
          docker tag "wutong-api:${GITHUB_SHA}" "$api"
          docker tag "wutong-worker:${GITHUB_SHA}" "$worker"
          docker tag "wutong-web:${GITHUB_SHA}" "$web"
          docker push "$api"
          docker push "$worker"
          docker push "$web"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --format cyclonedx --output /tmp/api-sbom.json "$api"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --format cyclonedx --output /tmp/worker-sbom.json "$worker"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --format cyclonedx --output /tmp/web-sbom.json "$web"
          docker inspect --format '{{join .RepoDigests "\n"}}' "$api" > /tmp/image-digests.txt
          docker inspect --format '{{join .RepoDigests "\n"}}' "$worker" >> /tmp/image-digests.txt
          docker inspect --format '{{join .RepoDigests "\n"}}' "$web" >> /tmp/image-digests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom-and-digests-${{ github.sha }}
          path: |
            /tmp/api-sbom.json
            /tmp/worker-sbom.json
            /tmp/web-sbom.json
            /tmp/image-digests.txt
          if-no-files-found: error
