# 抓取目标只有 API 进程（GET /metrics）。Worker 是独立进程、不监听 HTTP，
# 它的进程内计数器永远不会被抓到——因此所有关于 worker 的告警都必须基于
# API 从数据库导出的指标（metrics.go 中的 worker_heartbeat_* / email_outbox_messages /
# backup_last_success_timestamp_seconds），而不是 worker 自己的 worker_*_total。
#
# 每条依赖具体指标的规则都配了一条 absent() 兜底：指标本身消失（进程挂了、
# 改名了、抓取配置错了）时，普通表达式会求值为空向量而永远不 firing——
# 这正是「监控一片绿而备份早已停产」的成因。
groups:
  - name: campus-wall
    rules:
      - alert: ApiScrapeDown
        expr: up{job="campus-wall-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Campus Wall API 抓取失败（进程可能已停止）" }

      # up 只表示进程活着。/health/ready 才检查数据库、迁移版本与对象存储，
      # 建议用 blackbox_exporter 探测该端点后启用下面这条。
      - alert: ApiNotReady
        expr: probe_success{instance=~".*/health/ready"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Campus Wall API 就绪检查失败（依赖不可用）" }

      - alert: WorkerHeartbeatStale
        expr: time() - max by (worker) (worker_heartbeat_last_success_timestamp_seconds) > 600
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Worker 循环 {{ $labels.worker }} 超过 10 分钟没有成功完成" }

      - alert: WorkerHeartbeatMissing
        expr: absent(worker_heartbeat_last_success_timestamp_seconds)
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "完全没有 Worker 心跳指标：Worker 可能从未启动" }

      - alert: OutboxFailures
        expr: email_outbox_messages{status="failed"} > 10
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "邮件发送失败积压超过 10 封" }

      - alert: OutboxBacklog
        expr: email_outbox_messages{status="pending"} > 200
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "邮件待发队列持续积压" }

      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 90000
        for: 30m
        labels: { severity: critical }
        annotations: { summary: "超过 25 小时没有成功的备份" }

      - alert: BackupMetricMissing
        expr: absent(backup_last_success_timestamp_seconds)
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "备份指标缺失，无法判断备份是否正常" }

      - alert: ApiServerErrors
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.02
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "API 5xx 比例超过 2%" }

      - alert: StorageObjectDeleteFailures
        expr: increase(storage_object_delete_failures_total[1h]) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "对象存储删除失败，可能产生孤儿对象" }
