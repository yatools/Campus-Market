services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        attempt=0;
        until
          mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" &&
          mc mb --ignore-existing local/$${S3_PUBLIC_BUCKET} &&
          mc version enable local/$${S3_PUBLIC_BUCKET} &&
          mc mb --ignore-existing local/$${S3_PRIVATE_BUCKET} &&
          mc version enable local/$${S3_PRIVATE_BUCKET} &&
          mc mb --ignore-existing local/$${S3_BACKUP_BUCKET} &&
          mc version enable local/$${S3_BACKUP_BUCKET} &&
          mc anonymous set download local/$${S3_PUBLIC_BUCKET};
        do
          attempt=$$((attempt + 1));
          if [ "$$attempt" -ge 30 ]; then echo "MinIO initialization failed after 30 attempts" >&2; exit 1; fi;
          sleep 1;
        done
    env_file: ${ENV_FILE:-.env}
    networks: [internal]

  migrate:
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      COOKIE_SECURE: "false"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/${S3_PUBLIC_BUCKET}
      SMTP_HOST: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""

  api:
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      TRUSTED_HOSTS: 127.0.0.1,localhost
      COOKIE_SECURE: "false"
      DOCS_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/${S3_PUBLIC_BUCKET}
      SMTP_HOST: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
    depends_on:
      minio-init:
        condition: service_completed_successfully

  worker:
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      COOKIE_SECURE: "false"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/${S3_PUBLIC_BUCKET}
      SMTP_HOST: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
    depends_on:
      minio-init:
        condition: service_completed_successfully

  web:
    ports: !override
      - "127.0.0.1:8080:8080"
    volumes: !override
      - ./deploy/staging.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  minio_data:
